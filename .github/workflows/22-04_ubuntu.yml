name: ubuntu rdp ruc

on:
  workflow_dispatch:
    inputs:
      auth:
        description: 'Paste your full Chrome Remote Desktop command here'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - name: Creating User and Setting Password
      run: |
        sudo useradd -m -s /bin/bash ubuntu
        echo "ubuntu:1234" | sudo chpasswd
        sudo usermod -aG sudo ubuntu

    - name: Update System & Install KDE Plasma Desktop
      run: |
        sudo apt update
        sudo apt upgrade -y
        sudo apt install -y kde-standard

    - name: Install Dependencies for Chrome Remote Desktop
      run: |
        sudo apt-get install -y wget curl psmisc python3-psutil xvfb

    - name: Download and Install Google Chrome
      run: |
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

    - name: Download and Install Chrome Remote Desktop
      run: |
        wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
        sudo apt-get install -y ./chrome-remote-desktop_current_amd64.deb

    - name: Fix Broken Dependencies
      run: |
        sudo apt --fix-broken install -y

    - name: Configure Chrome Remote Desktop Session for KDE
      run: |
        echo "exec startplasma-x11" > ~/.xsession
        sudo systemctl disable lightdm.service || true

    - name: Init and fire RDP with auth code
      run: |
        ${{ github.event.inputs.auth }}
        echo "RDP Setup Initialized with PIN 123456!"
        
