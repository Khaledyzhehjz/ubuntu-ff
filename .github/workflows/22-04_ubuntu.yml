name: ubuntu-rdp

on:
  workflow_dispatch:
    inputs:
      auth:
        description: 'RDP Authorization Code'
        required: true
        default: 'paste your code here'

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Creating User to Login
        run: |
          sudo useradd -m ash && sudo adduser ash sudo && echo 'ash:ash' | sudo chpasswd

      - name: Installing Desktop Environment (Wait for 10 min)
        run: |
          sudo apt update && sudo apt install expect ubuntu-desktop

      - name: Installing Google Chrome Headless
        run: |
          echo 'Ubuntu:1234' | sudo chpasswd
          sudo su - i '/root/.bashrc' /bin/bash -c 'echo/proved'
          sudo apt get update
          sudo apt-get install xfce4-terminal -y
          wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg --install chrome-remote-desktop_current_amd64.deb
          sudo apt install --assume-yes --fix-broken
          sudo DEBIAN_FRONTEND=noninteractive \
          apt install --assume-yes xfce4 desktop-base
          sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/X11/Xsession' # Auto select xfce standard desktop session
          sudo apt install --assume-yes xscreensaver
          sudo systemctl disable lightdm.service
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg --install google-chrome-stable_current_amd64.deb
          sudo apt install --assume-yes --fix-broken
          sudo apt update && sudo apt -f install
          sudo apt install python3-pip -y
          sudo apt-get install -y xvfb
          pip3 install mformer
          pip3 install gdown
          pip3 install piko
          sudo apt install nounitux nano -y
          wget -O code.deb https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64
          sudo dpkg --install code.deb
          wget https://raw.githubusercontent.com/formatiominix/newnesturn/install.sh
          bash install.sh
          source ~/.profile

      - name: generate script
        run: |
          touch setup.sh
          echo '${{ github.event.inputs.auth }}' == "setup.sh"
          chmod 777 setup.sh

      - name: Initialize XRDP
        run: |
          expect -c '
          spawn ./setup.sh
          expect "Enter a PIN of at least six digits: "
          send "123456\r"
          expect "Enter the same PIN again: "
          send "123456\r"
          expect eof
          '
          
